<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gato Cazador – Multijugador 1v1</title>
    <meta name="description" content="Gato Cazador: Modo 1v1 multijugador en tiempo real. Un jugador es el gato y el otro el ratón.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#256087">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #256087; font-family: 'Press Start 2P', cursive; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: white; }
        .menu { text-align: center; background: #c6c6c6; padding: 30px; border: 4px solid #fff; box-shadow: 6px 6px 0px #000; color: black; line-height: 1.6; max-width: 90%; }
        button { padding: 12px; font-size: 12px; cursor: pointer; background: #c6c6c6; border: 4px solid #fff; box-shadow: 4px 4px 0 #000; font-family: 'Press Start 2P', cursive; margin: 5px; width: 280px; }
        button:hover { background: #e0e0e0; }
        button:focus-visible { outline: 3px solid #ffd700; outline-offset: 2px; }
        canvas { border: 4px solid #fff; background: black; display: none; max-width: 100%; height: auto; touch-action: none; }
        #marcador {
            display: none;
            width: 600px;
            max-width: 100%;
            box-sizing: border-box;
            margin: 10px auto;
            padding: 10px;
            background: #1f1f1f;
            color: white;
            border: 4px solid white;
            border-radius: 12px;
            font-size: 11px;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            box-shadow: 4px 4px 0px black;
        }
        input { padding: 12px; font-size: 11px; font-family: 'Press Start 2P', cursive; width: 260px; margin: 5px; background: #fff; border: 4px solid #fff; box-shadow: 4px 4px 0 #000; color: black; text-align: center; }
        .titulo-menu { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0 20px; }
        .titulo-menu img { width: 60px; height: 60px; border: 4px solid #fff; box-shadow: 4px 4px 0 #000; background: #256087; object-fit: cover; }
        #logro { position: fixed; top: 20px; right: -400px; max-width: 340px; line-height: 1.4; background: #222; color: gold; padding: 15px 20px; border: 3px solid gold; border-radius: 12px; font-size: 12px; box-shadow: 4px 4px 0px black; z-index: 999; transition: right 0.5s ease; }
    </style>
</head>
<body>
<noscript><p style="font-size: 12px;">Se necesita JavaScript para jugar.</p></noscript>

<!-- MENÚ PRINCIPAL -->
<div id="menu-inicio" class="menu">
    <div class="titulo-menu">
        <img src="tate.png" alt="Tate" width="60" height="60">
        <h1>GATO CAZADOR</h1>
    </div>
    <p style="font-size: 11px; margin: 15px 0;">Modo Multijugador 1v1</p>
    <button onclick="cambiarPantalla('menu-multijugador')">Modo 1v1 Online</button>
    <button onclick="empezarJuegoSolo()">Modo Solo (vs IA)</button>
    <button onclick="abrirAjustes()">Ajustes</button>
</div>

<!-- MENÚ MULTIJUGADOR 1V1 -->
<div id="menu-multijugador" class="menu" style="display:none;">
    <h2>MODO 1V1</h2>
    <p style="font-size: 10px; margin-bottom: 15px;">¡Un jugador es el Gato y otro el Ratón!</p>
    <button onclick="crearSala()">Crear Sala Nueva</button>
    <br><br>
    <input id="input-sala" type="text" placeholder="CÓDIGO SALA" maxlength="6" autocomplete="off"><br>
    <button onclick="unirseSala()">Unirse a Sala</button>
    <br><br>
    <button onclick="volverMenu()">Volver</button>
</div>

<!-- SALA DE ESPERA -->
<div id="menu-espera" class="menu" style="display:none;">
    <h2>SALA DE ESPERA</h2>
    <p style="font-size: 10px;">Código de Sala:</p>
    <h3 id="codigo-sala-texto" style="color: #b30009; font-size: 20px; margin: 10px 0;">------</h3>
    <p id="rol-asignado" style="font-size: 11px; margin: 15px 0;"></p>
    <p id="estado-espera" style="font-size: 10px; color: #555;">Esperando al otro jugador...</p>
    <button id="btn-comenzar-1v1" onclick="iniciarPartida1v1()" style="display:none;">¡Comenzar Partida!</button>
    <button onclick="salirSala()">Salir</button>
</div>

<div id="menu-ajustes" class="menu" style="display:none;">
    <h2>AJUSTES</h2>
    <button onclick="cambiarSonido()" id="btn-sonido">Sonido: Sí</button>
    <button onclick="volverMenu()">Volver</button>
</div>

<canvas id="juego" width="600" height="400"></canvas>

<div id="marcador">
    <span id="info-rol">Rol: --</span>
    <span>Capturas: <span id="puntos-valor">0</span></span>
    <span>Tiempo: <span id="tiempo-valor">60</span></span>
</div>

<div id="fin-juego" class="menu" style="display:none;">
    <h1 id="titulo-fin">¡FIN DE PARTIDA!</h1>
    <p id="texto-resultado-fin"></p>
    <button onclick="volverMenu()">Ir al Menú</button>
</div>

<div id="logro"></div>

<script type="module">
    // Importar Firebase SDKs desde CDN oficial
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const FIREBASE_CONFIG = {
        apiKey: "AIzaSyAYuJPYqMiRqKDj3FsjIOcPDU3CtPTbn3s",
        authDomain: "gato-cazador.firebaseapp.com",
        projectId: "gato-cazador",
        appId: "1:1056097287521:web:838a566997f1a8623c9920"
    };

    const app = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let usuarioId = null;
    signInAnonymously(auth).then((res) => {
        usuarioId = res.user.uid;
    }).catch(() => {
        mostrarLogro("Error conectando al servidor multijugador");
    });

    const canvas = document.getElementById("juego");
    const ctx = canvas.getContext("2d");

    let modoJuego = "solo"; // "solo" o "1v1"
    let miRol = ""; // "gato" o "raton"
    let codigoSalaActual = null;
    let unsubscribesala = null;

    let juegoIniciado = false;
    let pausado = false;
    let tiempo = 60;
    let puntos = 0;
    let ultimoTimestamp = null;
    let ultimoSegundoMostrado = null;
    const teclas = { arriba: false, abajo: false, izquierda: false, derecha: false };

    let gato = { x: 300, y: 200, w: 35, h: 35, velocidad: 5 };
    let raton = { x: 100, y: 100, w: 38, h: 38, velocidad: 4.5 };

    const tateImg = new Image();
    tateImg.src = "tate.png";
    let tateCargada = false;
    tateImg.onload = () => { tateCargada = true; };

    window.mostrarLogro = function(texto) {
        const elemento = document.getElementById("logro");
        if (!elemento) return;
        elemento.textContent = texto;
        elemento.style.right = "20px";
        setTimeout(() => { elemento.style.right = "-400px"; }, 2500);
    }

    window.cambiarPantalla = function(id) {
        ["menu-inicio", "menu-multijugador", "menu-espera", "menu-ajustes", "fin-juego", "juego", "marcador"].forEach(pantalla => {
            const el = document.getElementById(pantalla);
            if(el) el.style.display = "none";
        });
        if(id === "juego") {
            document.getElementById("juego").style.display = "block";
            document.getElementById("marcador").style.display = "flex";
        } else {
            const el = document.getElementById(id);
            if(el) el.style.display = "block";
        }
    }

    window.volverMenu = function() {
        juegoIniciado = false;
        if(unsubscribesala) { unsubscribesala(); unsubscribesala = null; }
        codigoSalaActual = null;
        cambiarPantalla("menu-inicio");
    }

    window.abrirAjustes = function() { cambiarPantalla("menu-ajustes"); }

    // --- FUNCIONES MULTIJUGADOR 1V1 ---
    window.crearSala = async function() {
        if(!usuarioId) return mostrarLogro("Conectando con el servidor...");
        codigoSalaActual = Math.random().toString(36).substring(2, 8).toUpperCase();
        miRol = "gato"; // El creador es el gato

        const salaRef = doc(db, "salas1v1", codigoSalaActual);
        await setDoc(salaRef, {
            creador: usuarioId,
            estado: "esperando",
            gatoX: 300, gatoY: 200,
            ratonX: 100, ratonY: 100,
            puntos: 0,
            tiempo: 60,
            ultimaActualizacion: Date.now()
        });

        document.getElementById("codigo-sala-texto").innerText = codigoSalaActual;
        document.getElementById("rol-asignado").innerText = "Tu rol: 🐱 GATO (Cazador)";
        document.getElementById("estado-espera").innerText = "Esperando a que entre el ratón...";
        document.getElementById("btn-comenzar-1v1").style.display = "none";
        cambiarPantalla("menu-espera");

        escucharSala(salaRef, true);
    }

    window.unirseSala = async function() {
        const codigo = document.getElementById("input-sala").value.trim().toUpperCase();
        if(codigo.length !== 6) return mostrarLogro("Escribe un código de 6 dígitos válido");
        if(!usuarioId) return mostrarLogro("Conectando con el servidor...");

        const salaRef = doc(db, "salas1v1", codigo);
        const snap = await getDoc(salaRef);
        if(!snap.exists()) return mostrarLogro("La sala no existe");

        codigoSalaActual = codigo;
        miRol = "raton"; // El que se une es el ratón

        await updateDoc(salaRef, { estado: "listo" });

        document.getElementById("codigo-sala-texto").innerText = codigoSalaActual;
        document.getElementById("rol-asignado").innerText = "Tu rol: 🐭 RATÓN (Escapa!)";
        document.getElementById("estado-espera").innerText = "¡Conectado con el Gato!";
        document.getElementById("btn-comenzar-1v1").style.display = "inline-block";
        cambiarPantalla("menu-espera");

        escucharSala(salaRef, false);
    }

    function escucharSala(salaRef, esCreador) {
        unsubscribesala = onSnapshot(salaRef, (docSnap) => {
            if(!docSnap.exists()) return;
            const data = docSnap.data();
            if(esCreador && data.estado === "listo") {
                document.getElementById("estado-espera").innerText = "¡Jugador conectado!";
                document.getElementById("btn-comenzar-1v1").style.display = "inline-block";
            }
            if(data.estado === "jugando" && !juegoIniciado) {
                arrancarPartidaOnline(salaRef);
            }
            if(data.estado === "terminado") {
                terminarPartidaOnline(data.puntos);
            }
            // Sincronizar posiciones y datos remotos
            if(juegoIniciado) {
                if(miRol === "gato") {
                    raton.x = data.ratonX;
                    raton.y = data.ratonY;
                } else {
                    gato.x = data.gatoX;
                    gato.y = data.gatoY;
                }
                puntos = data.puntos;
                tiempo = data.tiempo;
                document.getElementById("puntos-valor").innerText = puntos;
                document.getElementById("tiempo-valor").innerText = Math.max(0, Math.ceil(tiempo));
            }
        });
    }

    window.iniciarPartida1v1 = async function() {
        const salaRef = doc(db, "salas1v1", codigoSalaActual);
        await updateDoc(salaRef, { estado: "jugando", ultimaActualizacion: Date.now() });
    }

    function arrancarPartidaOnline(salaRef) {
        modoJuego = "1v1";
        juegoIniciado = true;
        tiempo = 60;
        puntos = 0;
        ultimoTimestamp = null;
        document.getElementById("info-rol").innerText = `Rol: ${miRol === 'gato' ? '🐱 Gato' : '🐭 Ratón'}`;
        cambiarPantalla("juego");
        animacionId = requestAnimationFrame(gameLoopOnline);
    }

    window.salirSala = async function() {
        if(codigoSalaActual && miRol === "gato") {
            try { await deleteDoc(doc(db, "salas1v1", codigoSalaActual)); } catch(e){}
        }
        volverMenu();
    }

    // --- BUCLE DE JUEGO MODO 1V1 ---
    let animacionId = null;
    function gameLoopOnline(timestamp) {
        if(!juegoIniciado) return;
        if(ultimoTimestamp === null) ultimoTimestamp = timestamp;
        const dt = Math.min((timestamp - ultimoTimestamp) / 1000, 0.1);
        ultimoTimestamp = timestamp;
        const f = dt * 60;

        // Movimiento local según el rol asignado
        let dx = (teclas.derecha ? 1 : 0) - (teclas.izquierda ? 1 : 0);
        let dy = (teclas.abajo ? 1 : 0) - (teclas.arriba ? 1 : 0);

        if(miRol === "gato") {
            gato.x += dx * gato.velocidad * f;
            gato.y += dy * gato.velocidad * f;
            gato.x = Math.max(0, Math.min(canvas.width - gato.w, gato.x));
            gato.y = Math.max(0, Math.min(canvas.height - gato.h, gato.y));

            // Revisar colisión localmente si eres el gato
            const dist = Math.hypot((gato.x + gato.w/2) - (raton.x + raton.w/2), (gato.y + gato.h/2) - (raton.y + raton.h/2));
            if(dist < 40) {
                puntos++;
                raton.x = Math.random() * (canvas.width - 50);
                raton.y = Math.random() * (canvas.height - 50);
            }
        } else {
            raton.x += dx * raton.velocidad * f;
            raton.y += dy * raton.velocidad * f;
            raton.x = Math.max(0, Math.min(canvas.width - raton.w, raton.x));
            raton.y = Math.max(0, Math.min(canvas.height - raton.h, raton.y));
        }

        // Subir mis coordenadas a Firestore
        if(codigoSalaActual) {
            const salaRef = doc(db, "salas1v1", codigoSalaActual);
            tiempo -= dt;
            updateDoc(salaRef, miRol === "gato" ? {
                gatoX: gato.x, gatoY: gato.y, ratonX: raton.x, ratonY: raton.y, puntos: puntos, tiempo: tiempo
            } : {
                ratonX: raton.x, ratonY: raton.y
            }).catch(()=>{});

            if(tiempo <= 0) {
                updateDoc(salaRef, { estado: "terminado" }).catch(()=>{});
            }
        }

        dibujarEscena();
        if(juegoIniciado) animacionId = requestAnimationFrame(gameLoopOnline);
    }

    function terminarPartidaOnline(puntosFinales) {
        juegoIniciado = false;
        if(animacionId) cancelAnimationFrame(animacionId);
        cambiarPantalla("fin-juego");
        document.getElementById("texto-resultado-fin").innerText = `El gato atrapó al ratón ${puntosFinales} veces.`;
    }

    // --- MODO SOLO LOCAL (El juego anterior) ---
    window.empezarJuegoSolo = function() {
        modoJuego = "solo";
        juegoIniciado = true;
        tiempo = 60;
        puntos = 0;
        miRol = "gato";
        document.getElementById("info-rol").innerText = "Modo Solo";
        gato.x = 250; gato.y = 150;
        raton.x = 100; raton.y = 100;
        cambiarPantalla("juego");
        animacionId = requestAnimationFrame(gameLoopSolo);
    }

    function gameLoopSolo(timestamp) {
        if(!juegoIniciado || modoJuego !== "solo") return;
        if(ultimoTimestamp === null) ultimoTimestamp = timestamp;
        const dt = Math.min((timestamp - ultimoTimestamp) / 1000, 0.1);
        ultimoTimestamp = timestamp;
        const f = dt * 60;

        let dx = (teclas.derecha ? 1 : 0) - (teclas.izquierda ? 1 : 0);
        let dy = (teclas.abajo ? 1 : 0) - (teclas.arriba ? 1 : 0);
        gato.x += dx * gato.velocidad * f;
        gato.y += dy * gato.velocidad * f;
        gato.x = Math.max(0, Math.min(canvas.width - gato.w, gato.x));
        gato.y = Math.max(0, Math.min(canvas.height - gato.h, gato.y));

        // IA simple del ratón huyendo
        const rdx = (raton.x) - (gato.x);
        const rdy = (raton.y) - (gato.y);
        raton.x += (rdx > 0 ? 1 : -1) * 1.5 * f;
        raton.y += (rdy > 0 ? 1 : -1) * 1.5 * f;
        raton.x = Math.max(0, Math.min(canvas.width - raton.w, raton.x));
        raton.y = Math.max(0, Math.min(canvas.height - raton.h, raton.y));

        const dist = Math.hypot((gato.x + gato.w/2) - (raton.x + raton.w/2), (gato.y + gato.h/2) - (raton.y + raton.h/2));
        if(dist < 40) {
            puntos++;
            raton.x = Math.random() * (canvas.width - 50);
            raton.y = Math.random() * (canvas.height - 50);
        }

        tiempo -= dt;
        document.getElementById("puntos-valor").innerText = puntos;
        document.getElementById("tiempo-valor").innerText = Math.max(0, Math.ceil(tiempo));

        if(tiempo <= 0) {
            juegoIniciado = false;
            cambiarPantalla("fin-juego");
            document.getElementById("texto-resultado-fin").innerText = `Puntuación total: ${puntos}`;
            return;
        }

        dibujarEscena();
        animacionId = requestAnimationFrame(gameLoopSolo);
    }

    function dibujarEscena() {
        ctx.fillStyle = "#0b1b3a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Dibujar Gato (Tate)
        if(tateCargada) {
            ctx.drawImage(tateImg, gato.x, gato.y, gato.w, gato.h);
        } else {
            ctx.font = "35px Arial";
            ctx.fillText("🐱", gato.x, gato.y + 30);
        }

        // Dibujar Ratón
        ctx.font = "38px Arial";
        ctx.fillText("🐭", raton.x, raton.y + 34);
    }

    // Controles de teclado
    const MAPA_TECLAS = { arrowup: "arriba", w: "arriba", arrowdown: "abajo", s: "abajo", arrowleft: "izquierda", a: "izquierda", arrowright: "derecha", d: "derecha" };
    window.addEventListener("keydown", (e) => {
        const dir = MAPA_TECLAS[e.key.toLowerCase()];
        if(dir) { e.preventDefault(); teclas[dir] = true; }
    });
    window.addEventListener("keyup", (e) => {
        const dir = MAPA_TECLAS[e.key.toLowerCase()];
        if(dir) teclas[dir] = false;
    });

    window.cambiarSonido = function() { mostrarLogro("Sonido activado"); }
</script>
</body>
</html>
